name: Run Eventernote attendance analysis

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Eventernote 用户 ID
        required: true
        default: Tokuzawa353567
      actor_name:
        description: 艺人名称（会自动解析到 Eventernote 艺人页）
        required: true
        default: 鈴木愛奈
      year:
        description: 统计年份
        required: true
        default: '2025'

permissions:
  contents: write

concurrency:
  group: eventernote-attendance-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analyzer
        run: |
          python scripts/fetch_attendance.py \
            --user-id "${{ inputs.user_id }}" \
            --actor-name "${{ inputs.actor_name }}" \
            --year "${{ inputs.year }}" \
            --output data/latest-result.json

      - name: Commit latest result
        run: |
          if git diff --quiet -- data/latest-result.json; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-result.json
          git commit -m "Update attendance result for ${{ inputs.user_id }} / ${{ inputs.actor_name }} / ${{ inputs.year }}"
          git push
