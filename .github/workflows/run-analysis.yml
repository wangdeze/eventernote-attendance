name: Run Eventernote attendance analysis

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Eventernote 用户 ID
        required: true
        default: Tokuzawa353567
      actor_name:
        description: 艺人名称（会自动解析到 Eventernote 艺人页）
        required: true
        default: 鈴木愛奈
      year:
        description: 统计年份
        required: true
        default: '2025'

permissions:
  contents: write

concurrency:
  group: eventernote-attendance-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve target branch
        id: target-branch
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            branch="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target-branch.outputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run analyzer
        env:
          USER_ID: ${{ inputs.user_id }}
          ACTOR_NAME: ${{ inputs.actor_name }}
          YEAR: ${{ inputs.year }}
        run: |
          python scripts/fetch_attendance.py \
            --user-id "${USER_ID}" \
            --actor-name "${ACTOR_NAME}" \
            --year "${YEAR}" \
            --output data/latest-result.json

      - name: Commit latest result
        env:
          USER_ID: ${{ inputs.user_id }}
          ACTOR_NAME: ${{ inputs.actor_name }}
          YEAR: ${{ inputs.year }}
          TARGET_BRANCH: ${{ steps.target-branch.outputs.branch }}
        run: |
          if git diff --quiet -- data/latest-result.json; then
            echo "No result changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-result.json
          git commit -m "Update attendance result for ${USER_ID} / ${ACTOR_NAME} / ${YEAR}"
          git push origin "HEAD:${TARGET_BRANCH}"
