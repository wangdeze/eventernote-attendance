# Include only inside the existing HTTPS server block; keep Certbot's TLS settings.
root /srv/eventernote/www;
index index.html;
auth_basic "Eventernote";
auth_basic_user_file /etc/nginx/eventernote.htpasswd;
client_max_body_size 16k;
client_body_timeout 15s;
add_header X-Content-Type-Options nosniff always;

location / {
    try_files $uri $uri/ =404;
}

location = /api/analyze {
    limit_req zone=eventernote_requests burst=2 nodelay;
    limit_req_status 429;
    limit_conn eventernote_connections 2;
    limit_conn_status 503;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 605s;
    proxy_send_timeout 15s;
}
